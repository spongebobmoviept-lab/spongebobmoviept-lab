<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Tunerbox</title>
  <desc id="d">Tunerbox sits between Dispatcharr and Plex Live TV. Below, a TV guide grid with regular channels and two event channels that keep their numbers.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c65a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="398.5" height="298.5" rx="15" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.5"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- header -->
    <rect x="22" y="20" width="44" height="44" rx="10" fill="url(#gold)"/>
    <text x="44" y="53" font-size="30" font-weight="800" fill="#101010" text-anchor="middle">T</text>
    <text x="79" y="43" font-size="23" font-weight="800" fill="#ececec">Tunerbox</text>
    <text x="80" y="60" font-size="10" font-weight="700" letter-spacing="1.4" fill="#c9a94a">DISPATCHARR TO PLEX LIVE TV</text>

    <!-- where it sits -->
    <g font-size="12.500" font-weight="700" text-anchor="middle">
      <rect x="22" y="88" width="106" height="28" rx="7" fill="#19191c" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="75" y="106.500" fill="#ececec">Dispatcharr</text>
      <rect x="152" y="88" width="96" height="28" rx="7" fill="url(#gold)"/>
      <text x="200" y="106.500" fill="#101010">Tunerbox</text>
      <rect x="272" y="88" width="106" height="28" rx="7" fill="#19191c" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="325" y="106.500" fill="#ececec">Plex Live TV</text>
    </g>
    <g fill="none" stroke="#d4af37" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round">
      <path d="M132 102h15M142.500 97.500l5 4.500-5 4.500"/>
      <path d="M252 102h15M262.500 97.500l5 4.500-5 4.500"/>
    </g>

    <!-- guide -->
    <rect x="22" y="128" width="356" height="152" rx="10" fill="#131315" stroke="#ffffff" stroke-opacity="0.10"/>
    <g font-size="9.500" font-weight="700" letter-spacing="1" fill="#75757b">
      <text x="34" y="145">CH</text>
      <text x="96" y="145">7:00</text>
      <text x="187" y="145">7:30</text>
      <text x="278" y="145">8:00</text>
    </g>
    <g fill="#1f1f23">
      <rect x="32" y="152" width="56" height="24" rx="6"/>
      <rect x="32" y="182" width="56" height="24" rx="6"/>
      <rect x="32" y="212" width="56" height="24" rx="6"/>
      <rect x="32" y="242" width="56" height="24" rx="6"/>
    </g>
    <g font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e8c65a" text-anchor="middle">
      <text x="60" y="168.500">101</text>
      <text x="60" y="198.500">102</text>
      <text x="60" y="228.500">1001</text>
      <text x="60" y="258.500">1002</text>
    </g>
    <g fill="#2a2a30">
      <rect x="96" y="152" width="80" height="24" rx="6"/>
      <rect x="296" y="152" width="72" height="24" rx="6"/>
      <rect x="96" y="182" width="54" height="24" rx="6"/>
      <rect x="154" y="182" width="116" height="24" rx="6"/>
      <rect x="274" y="182" width="94" height="24" rx="6"/>
    </g>
    <rect x="180" y="152" width="112" height="24" rx="6" fill="#d4af37" fill-opacity="0.22" stroke="#d4af37" stroke-opacity="0.75"/>
    <g fill="none" stroke="#d4af37" stroke-opacity="0.80" stroke-dasharray="4 3">
      <rect x="120" y="212" width="166" height="24" rx="6"/>
      <rect x="252" y="242" width="116" height="24" rx="6"/>
    </g>
    <g font-size="9.500" font-weight="700" letter-spacing="1" fill="#e8c65a">
      <text x="130" y="227.500">EVENT 1</text>
      <text x="262" y="257.500">EVENT 2</text>
    </g>
    <!-- now -->
    <path d="M236 148v122" stroke="#e8c65a" stroke-width="1.500"/>
    <path d="M231.500 144h9l-4.500 6z" fill="#e8c65a"/>
  </g>
</svg>
