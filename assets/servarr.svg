<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Servarr</title>
  <desc id="d">A Discord bot for a Plex server's community, with four jobs: Movie Night, release calendars, leveling and moderation.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c65a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="398.5" height="298.5" rx="15" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.5"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- header -->
    <rect x="22" y="20" width="44" height="44" rx="10" fill="url(#gold)"/>
    <text x="44" y="53" font-size="30" font-weight="800" fill="#101010" text-anchor="middle">S</text>
    <text x="79" y="43" font-size="23" font-weight="800" fill="#ececec">Servarr</text>
    <text x="80" y="60" font-size="10" font-weight="700" letter-spacing="1.4" fill="#c9a94a">DISCORD BOT FOR PLEX SERVERS</text>

    <!-- four jobs -->
    <g fill="#131315" stroke="#ffffff" stroke-opacity="0.10">
      <rect x="22" y="88" width="172" height="90" rx="10"/>
      <rect x="206" y="88" width="172" height="90" rx="10"/>
      <rect x="22" y="190" width="172" height="90" rx="10"/>
      <rect x="206" y="190" width="172" height="90" rx="10"/>
    </g>
    <!-- Movie Night is the flagship: gold edge -->
    <rect x="22" y="88" width="172" height="90" rx="10" fill="none" stroke="#d4af37" stroke-opacity="0.65"/>

    <g fill="none" stroke="#e8c65a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- clapperboard -->
      <g transform="translate(35 101) scale(0.88)">
        <rect x="3" y="10.500" width="18" height="11" rx="2"/>
        <path d="M3.300 10.200L20.200 5.200l-1-3.300L2.300 6.900z"/>
        <path d="M8.200 5.200l1.600 3M13.200 3.700l1.600 3"/>
      </g>
      <!-- calendar -->
      <g transform="translate(219 101) scale(0.88)">
        <rect x="3" y="5" width="18" height="16.500" rx="3"/>
        <path d="M3 10.500h18M8 3v4M16 3v4"/>
        <path d="M8 15h2M14 15h2" stroke-width="2.200"/>
      </g>
      <!-- rising bars -->
      <g transform="translate(35 203) scale(0.88)">
        <path d="M5 21v-6M12 21V10M19 21V4" stroke-width="3.200"/>
      </g>
      <!-- shield -->
      <g transform="translate(219 203) scale(0.88)">
        <path d="M12 2.800l8 3v6.200c0 4.700-3.300 8.200-8 9.700-4.700-1.500-8-5-8-9.700V5.800z"/>
        <path d="M8.600 12.200l2.500 2.500 4.500-5"/>
      </g>
    </g>

    <g font-size="12.500" font-weight="700" fill="#ececec">
      <text x="63" y="116.500">Movie Night</text>
      <text x="247" y="116.500">Release calendars</text>
      <text x="63" y="218.500">Leveling</text>
      <text x="247" y="218.500">Moderation</text>
    </g>
    <g font-size="11" fill="#96969b">
      <text x="36" y="146">A daily vote, then the</text>
      <text x="36" y="162">winner plays at showtime</text>
      <text x="220" y="146">Movies, TV and anime,</text>
      <text x="220" y="162">from Radarr and Sonarr</text>
      <text x="36" y="248">XP for chatting, /rank</text>
      <text x="36" y="264">and /leaderboard</text>
      <text x="220" y="248">/kick, /ban, /timeout</text>
      <text x="220" y="264">and /warn, with a mod log</text>
    </g>
  </g>
</svg>
