<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Nyaarr</title>
  <desc id="d">Anime releases sorted by what their titles really say: English subs from a known group are high confidence, a bare "Subbed" is unknown and waits for you, and foreign-language subs never count as English.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c65a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="398.5" height="298.5" rx="15" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.5"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- header -->
    <rect x="22" y="20" width="44" height="44" rx="10" fill="url(#gold)"/>
    <text x="44" y="53" font-size="30" font-weight="800" fill="#101010" text-anchor="middle">N</text>
    <text x="79" y="43" font-size="23" font-weight="800" fill="#ececec">Nyaarr</text>
    <text x="80" y="60" font-size="10" font-weight="700" letter-spacing="1.4" fill="#c9a94a">ANIME FOR SONARR + RADARR</text>

    <!-- release 1: high confidence -->
    <rect x="22" y="88" width="356" height="56" rx="10" fill="#131315" stroke="#3fb950" stroke-opacity="0.55"/>
    <text x="36" y="111" font-size="13" font-weight="700" fill="#ececec">English subs, known group</text>
    <text x="36" y="129" font-size="11.500" fill="#96969b">can be grabbed automatically</text>
    <rect x="292" y="104" width="74" height="24" rx="12" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950" stroke-opacity="0.8"/>
    <text x="329" y="120.500" font-size="11" font-weight="700" letter-spacing="0.8" fill="#56d364" text-anchor="middle">HIGH</text>

    <!-- release 2: unknown -->
    <rect x="22" y="153" width="356" height="56" rx="10" fill="#131315" stroke="#d29922" stroke-opacity="0.55"/>
    <text x="36" y="176" font-size="13" font-weight="700" fill="#ececec">Just says “Subbed”</text>
    <text x="36" y="194" font-size="11.500" fill="#96969b">waits for your pick</text>
    <rect x="270" y="169" width="96" height="24" rx="12" fill="#d29922" fill-opacity="0.18" stroke="#d29922" stroke-opacity="0.8"/>
    <text x="318" y="185.500" font-size="11" font-weight="700" letter-spacing="0.8" fill="#e3b341" text-anchor="middle">UNKNOWN</text>

    <!-- release 3: foreign sub -->
    <rect x="22" y="218" width="356" height="56" rx="10" fill="#131315" stroke="#f85149" stroke-opacity="0.45"/>
    <text x="36" y="241" font-size="13" font-weight="700" fill="#ececec">VOSTFR, German, Spanish…</text>
    <text x="36" y="259" font-size="11.500" fill="#96969b">never counts as English subs</text>
    <rect x="252" y="234" width="114" height="24" rx="12" fill="#f85149" fill-opacity="0.16" stroke="#f85149" stroke-opacity="0.75"/>
    <text x="309" y="250.500" font-size="11" font-weight="700" letter-spacing="0.8" fill="#ff7b72" text-anchor="middle">FOREIGN SUB</text>
  </g>
</svg>
