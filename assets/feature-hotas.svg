  <rect x="0.75" y="0.75" width="270.5" height="150.5" rx="13" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="270.5" height="150.5" rx="13" fill="none" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="1.5"/>
